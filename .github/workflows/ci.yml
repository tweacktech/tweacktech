name: CI

on:
  push:
    branches: [main, LMS]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false

      - name: Production build
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          # Prerendering needs a live API; CI only checks that the app builds.
          SKIP_PRERENDER: '1'
        run: npm run build

  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
