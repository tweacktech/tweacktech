    <!-- Apply the saved theme before React paints to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tweacktech-theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(dark ? 'dark' : 'light');
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <script>
      // Only enable the service worker on a real deployment. During local
      // development it caches webpack chunks and serves stale code after edits.
      var localHosts = ['localhost', '127.0.0.1', '0.0.0.0', '[::1]'];
      var isLocal = localHosts.indexOf(window.location.hostname) !== -1;

      if ('serviceWorker' in navigator) {
        if (isLocal) {
          // Clean up any worker registered by an earlier run.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        } else {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/service-worker.js')
              .catch(function (error) {
                console.log('Service worker registration failed:', error);
              });
          });
        }
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.deferredPrompt = event;
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
    </script>
