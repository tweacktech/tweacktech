<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · TweackTech</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #f1f5f9; }
        .card { background: #0f172a; border-color: #1e293b; }
        p { color: #94a3b8; }
      }
      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 24px 60px -30px rgba(15, 23, 42, 0.35);
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #ef4444, #991b1b);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #fff;
        font-size: 28px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.6; margin: 0 0 24px; color: #64748b; }
      button {
        border: 0;
        border-radius: 12px;
        background: #dc2626;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:hover { background: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">T</div>
      <h1>You are offline</h1>
      <p>
        TweackTech needs a connection the first time you open some pages.
        Previously visited pages and lessons may still be available.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
    <script>
      // Reopen automatically once connectivity is back so the user never has
      // to notice this page was shown.
      window.addEventListener('online', function () {
        window.location.reload();
      });
      setInterval(function () {
        fetch('/api/health', { cache: 'no-store' })
          .then(function (response) {
            if (response.ok) window.location.reload();
          })
          .catch(function () {});
      }, 6000);
    </script>
  </body>
</html>
